name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
      - run: GOOS=wasip1 GOARCH=wasm go vet ./...
  # Тег v* — воспроизводимая сборка модуля, пакет .g4c с подписью издателя,
  # релиз; затем pull request в gate4ai/registry с sha256 и digest из вывода pack.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/gate4ai/gate4ai/cmd/gate4ai@latest
      - name: pack
        env:
          PUBLISHER_KEY: ${{ secrets.GATE4AI_PUBLISHER_KEY }}
        run: |
          umask 077
          printf '%s\n' "$PUBLISHER_KEY" > "$RUNNER_TEMP/publisher.key"
          gate4ai connectors pack . --key "$RUNNER_TEMP/publisher.key" -o package.g4c | tee pack.json
          rm "$RUNNER_TEMP/publisher.key"
      - run: gh release create "$GITHUB_REF_NAME" package.g4c pack.json --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
